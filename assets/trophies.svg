    </linearGradient>
    </defs>
  <style>
    @keyframes trophypop { from{opacity:0; transform:scale(0.75) translateY(10px);} to{opacity:1; transform:scale(1) translateY(0);} }
    .shineband { animation: shineband 3s ease-in-out infinite; }
    @keyframes shineband { 0% { transform: translateX(-90px);} 100% { transform: translateX(90px);} }
    
.trophy0 { opacity:0; transform-box: fill-box; transform-origin: center; animation: trophypop 0.5s cubic-bezier(.2,.8,.3,1.3) 0.15s 1 forwards; }

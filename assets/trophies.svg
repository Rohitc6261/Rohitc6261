.trophy4 { opacity:0; transform-box: fill-box; transform-origin: center; animation: trophypop 0.5s cubic-bezier(.2,.8,.3,1.3) 0.67s 1 forwards; }
.trophy5 { opacity:0; transform-box: fill-box; transform-origin: center; animation: trophypop 0.5s cubic-bezier(.2,.8,.3,1.3) 0.80s 1 forwards; }</style>

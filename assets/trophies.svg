<svg width="860" height="190" viewBox="0 0 860 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Achievements">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#131b2e"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="0" y="0" width="860" height="190" rx="16"/></clipPath>
    
    <linearGradient id="trophyShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="56%" stop-color="#ffffff" stop-opacity="0"/>
